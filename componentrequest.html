<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Request a Dynamic Component</title>
<link rel="stylesheet" href="css/style.css" />
<style>
  .funky-button::after { 
    content: " ↔"; 
    animation: pulseArrow 1.2s infinite ease-in-out; 
  }

  @keyframes pulseArrow { 
    0% { transform: translateX(0); } 
    50% { transform: translateX(4px); } 
    100% { transform: translateX(0); } 
  } 

  .sparkle {
    animation: sparkle 1.8s infinite ease-in-out;
  }

  @keyframes sparkle {
    0% { opacity: 0.4; }
    50% { opacity: 1; }
    100% { opacity: 0.4; }
  }
</style>

	<script>
		function celebrate() {
			const btn = document.getElementById("submitBtn");
			btn.style.display = "none";
			
			// Show the success message and action buttons after submission
			setTimeout(() => {
				document.getElementById("successMessage").style.display = "block";
				document.getElementById("postSubmitActions").style.display = "flex";
			}, 1200);
		}
		
		function resetFormAndScrollToTop() {
			// Reset the form
			document.getElementById("name").value = "";
			document.getElementById("email").value = "";
			document.getElementById("component").value = "";
			document.getElementById("details").value = "";
			document.getElementById("tier").selectedIndex = 0;
			
			// Reset the submit button visibility
			const btn = document.getElementById("submitBtn");
			btn.style.display = "block";
			
			// Hide the success message and action buttons
			document.getElementById("successMessage").style.display = "none";
			document.getElementById("postSubmitActions").style.display = "none";
			
			// Scroll to top
			window.scrollTo({ top: 0, behavior: 'smooth' });
		}
	</script>
	<script 
		src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js">
	</script>

	<script>
	function sendDynamicEmail() {
	  // Fire confetti first
	  setTimeout(() => {
		confetti({
		  particleCount: 120,
		  spread: 70,
		  origin: { y: 0.6 }
		});
	  }, 300); // small delay so the user sees it

	  // Then delay the mailto so confetti is visible
	  setTimeout(() => {
		const name = document.getElementById("name").value;
		const email = document.getElementById("email").value;
		const component = document.getElementById("component").value;
		const details = document.getElementById("details").value;
		const tier = document.getElementById("tier").value;

		const subject = `DynamicBits Request: ${component || "New Component"}`;

		const body =
		  "Name: " + name + "\n" +
		  "Email: " + email + "\n" +
		  "Component: " + component + "\n" +
		  "Tier: " + tier + "\n\n" +
		  "Details:\n" + details + "\n";

		const mailtoLink =
		  "mailto:dynamicbits@worqbox.online"
		  + "?subject=" + encodeURIComponent(subject)
		  + "&body=" + encodeURIComponent(body);

		window.location.href = mailtoLink;
	  }, 900); // confetti plays for ~0.7s before email client opens
	}
	</script>

</head>
<body>

<section style="background: var(--pure-white); padding: 3rem 1rem;">
	<div style="display: flex; justify-content: center; align-items: center; flex-direction: column;"> 
		<a href="index.html"><img src="assets/img/dynamicbits-logo.png" alt="DynamicBits logo" style="max-width: 100%; height: 100%; width: 160px; margin-bottom: 2rem;"/> </a>

		<header style="text-align: center;">
		  <h1>Request Your Dynamic Component</h1>
		  <p class="sparkle">Let's build something clever, modular, and fun</p>
		</header>
	</div>
</section>

<section style="background: var(--deep-space-blue); padding: 3rem 1rem;">
<div class="form-container">
  <h2 style="color: var(--pure-white);">Tell Me What You Need</h2>

  <label>Your Name</label>
  <input type="text" id="name" placeholder="Who’s making the magic?" />

  <label>Email</label>
  <input type="text" id="email" placeholder="Where should I send your component?" />

  <label>Component Name</label>
  <input type="text" id="component" placeholder="e.g., Adjustable Cabinet, Parametric Window…" />

  <label>Describe What It Should Do</label>
  <textarea placeholder="Tell me the behaviours, dimensions, presets, or anything else you want." id="details"></textarea>

  <label>Choose Your Tier</label>
  <select id="tier">
    <option>Community Component (Free / Tip)</option>
    <option>Private Component (Paid)</option>
    <option>Premium Build + Video (Paid+)</option>
  </select>

  <div class="tier-box">
    <p><strong>Fun hint:</strong> The more detail you give, the smarter the component becomes.</p>
  </div>

  <button id="submitBtn" class="funky-button" onclick="celebrate();sendDynamicEmail()">Submit Request</button>
  
  <p id="successMessage" style="display: none; color: var(--violet-pulse); font-size: 1.3rem; font-weight: bold; text-align: center; margin-top: 2rem;">
    ✨ Request Sent! ✨
  </p>
  
  <div id="postSubmitActions" style="display: none; flex-direction: column; gap: 1rem; margin-top: 1.5rem;">
    <button class="funky-button" onclick="resetFormAndScrollToTop()" style="background: var(--violet-pulse);">
      Request Another Component
    </button>
    <button class="funky-button" onclick="window.location.href='index.html';" style="background: var(--neon-arc-blue);">
      Back to Home
    </button>
  </div>
  
   <br/>&nbsp;<br/>
</div>
</section>

<section style="background: linear-gradient(135deg, var(--solar-ember) 0%, var(--violet-pulse) 100%); padding: 2rem 1rem; text-align: center;">
  <div style="max-width: 400px; margin: 0 auto;">
    <script 
      type="text/javascript" 
      src="https://cdnjs.buymeacoffee.com/1.0.0/button.prod.min.js" 
      data-name="bmc-button" 
      data-slug="romski" 
      data-color="#FFDD00" 
      data-emoji="☕"  
      data-font="Lato" 
      data-text="Buy me a coffee" 
      data-outline-color="#000000" 
      data-font-color="#000000" 
      data-coffee-color="#ffffff">
    </script>
  </div>
</section>

</body>
</html>
